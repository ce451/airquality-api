spring.application.name=AirQualityApi
spring.application.version=0.6.0

# DataSource config
#spring.datasource.url=jdbc:postgresql://localhost:5432/airquality_db
spring.datasource.url=jdbc:postgresql://s03:5432/airquality_db
spring.datasource.username=postgres
spring.datasource.password=timspwftu25

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jackson.time-zone=Europe/Vienna

# Flyway
# History (V1 baseline ... V9) already exists on the prod DB, so V10 runs next.
# baseline-on-migrate covers a DB that has the schema but no flyway_schema_history
# (e.g. a partial restore): Flyway baselines at V1 and applies V2.. on top, instead
# of refusing to start. No-op on the prod DB, which already has a history table.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Measurement Cleanup Configuration
# Retention period in days (default: 30 days = 1 month)
measurement.retention.days=30
# Cron schedule for cleanup task (default: daily at 2:00 AM)
# Format: second minute hour day-of-month month day-of-week
measurement.cleanup.cron=0 0 2 * * ?

# Measurement Thinning (Decimation) Configuration
# Progressively reduces the resolution of older measurements (keeps one row per
# (station, time-bucket), deletes the rest). Runs every 5 minutes by default.
measurement.thinning.cron=0 */5 * * * ?
# Tier 1: data older than 10 min -> keep one per 30 s
measurement.thinning.tier1.after-minutes=10
measurement.thinning.tier1.interval-seconds=30
# Tier 2: data older than 1 h -> keep one per 60 s
measurement.thinning.tier2.after-minutes=60
measurement.thinning.tier2.interval-seconds=60
# Tier 3: data older than 1 day -> keep one per 300 s
measurement.thinning.tier3.after-minutes=1440
measurement.thinning.tier3.interval-seconds=300

